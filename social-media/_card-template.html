<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Novo no blog: {{ARTICLE_TITLE}}</title>
<meta name="hz:slide-selector" content=".instapost" />
<meta name="hz:canvas-width" content="1080" />
<meta name="hz:canvas-height" content="1350" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #05070f;
}

.instapost {
  position: relative;
  width: 1080px;
  height: 1350px;
  background: #0B1533;
  overflow: hidden;
  font-family: 'Montserrat', sans-serif;
}

.dot-grid {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.09) 1.6px, transparent 1.6px);
  background-size: 26px 26px;
  opacity: 0.5;
}

.arc {
  position: absolute;
  border-radius: 50%;
  border: 1.5px solid rgba(46,107,255,0.35);
}
.arc-1 { width: 900px; height: 900px; right: -420px; top: -360px; }
.arc-2 { width: 620px; height: 620px; right: -260px; top: -140px; border-color: rgba(46,107,255,0.22); }

.accent-bar {
  position: absolute;
  left: 88px;
  top: 96px;
  width: 64px;
  height: 10px;
  background: #2E6BFF;
  border-radius: 6px;
}

.eyebrow {
  position: absolute;
  left: 88px;
  top: 124px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #2E6BFF;
}

.hook {
  position: absolute;
  left: 88px;
  right: 88px;
  top: 210px;
  font-family: 'Poppins', sans-serif;
  font-weight: 800;
  font-size: 66px;
  line-height: 1.14;
  letter-spacing: -0.01em;
  color: #FFFFFF;
}

.hook .accent { color: #2E6BFF; }

.divider {
  position: absolute;
  left: 88px;
  top: 610px;
  width: 904px;
  height: 1px;
  background: rgba(255,255,255,0.14);
}

.article-label {
  position: absolute;
  left: 88px;
  top: 648px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
}

.article-title {
  position: absolute;
  left: 88px;
  right: 88px;
  top: 686px;
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  font-size: 33px;
  line-height: 1.36;
  color: rgba(255,255,255,0.94);
}

.cta-box {
  position: absolute;
  left: 88px;
  right: 88px;
  top: 900px;
  padding: 30px 34px;
  border-radius: 20px;
  background: rgba(46,107,255,0.12);
  border: 1px solid rgba(46,107,255,0.4);
}

.cta-box p {
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 22px;
  color: #FFFFFF;
}

.cta-box span {
  display: block;
  margin-top: 6px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 500;
  font-size: 17px;
  color: rgba(255,255,255,0.6);
}

.footer {
  position: absolute;
  left: 88px;
  right: 88px;
  bottom: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.footer-logo { height: 34px; }
.footer-logo svg { height: 34px; width: auto; display: block; }

.footer-tag {
  font-family: 'Montserrat', sans-serif;
  font-weight: 500;
  font-size: 15px;
  color: rgba(255,255,255,0.45);
  text-align: right;
}
</style>
</head>
<body>
  <div class="instapost" data-canvas-width="1080" data-canvas-height="1350">
    <div class="dot-grid"></div>
    <div class="arc arc-1"></div>
    <div class="arc arc-2"></div>

    <div class="accent-bar"></div>
    <p class="eyebrow">Novo no blog ↗</p>

    <h1 class="hook">{{HOOK_HTML}}</h1>

    <div class="divider"></div>
    <p class="article-label">Leia agora</p>
    <p class="article-title">{{ARTICLE_TITLE}}</p>

    <div class="cta-box">
      <p>Artigo completo no blog da Azuz.</p>
      <span>Link nos stories.</span>
    </div>

    <div class="footer">
      <div class="footer-logo">

            </g>
            <rect class="cls-2" x="76.11" y="114.91" width="38.22" height="190.44" rx="19.11" ry="19.11" transform="translate(-114.91 305.35) rotate(-90)"/>
          </g>
        </svg>
      </div>
      <p class="footer-tag">Marcas fortes são<br>construídas diariamente.</p>
    </div>
  </div>
</body>
</html>
